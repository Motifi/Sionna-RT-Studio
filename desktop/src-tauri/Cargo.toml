[package]
name = "sionna-rt-studio"
version = "0.1.2"
edition = "2021"
publish = false

[[bin]]
name = "SionnaRTStudio"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.5", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
