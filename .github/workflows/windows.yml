name: Windows desktop

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      SRTS_MITSUBA_VARIANT: llvm_ad_mono_polarized
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare the MSVC x64 Rust toolchain
        run: |
          $toolchain = 'stable-x86_64-pc-windows-msvc'
          rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Locate LLVM for the CPU smoke test
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin\LLVM-C.dll'
          if (-not (Test-Path -LiteralPath $llvm -PathType Leaf)) { throw "Runner LLVM DLL missing at $llvm" }
          "DRJIT_LIBLLVM_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the Windows x64 build
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'Studio Windows Test\app'
          & .\desktop\windows\Install-Studio.ps1 -InstallDirectory $app -PythonPath (Get-Command python.exe).Source -NoShortcut -SkipWebView2Check
      - name: Test the Tauri shell
        run: cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path desktop/src-tauri/Cargo.toml --target-dir build/tauri
      - name: Check the frontend
        run: |
          npm.cmd run lint -- --noUnusedLocals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node.exe --import tsx --test scripts/check-project-storage.ts scripts/check-scene-devices.ts scripts/check-csi-history.ts scripts/check-quick-start.ts scripts/check-coverage-comparison.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run check:osm-parser
          exit $LASTEXITCODE
      - name: Run installed backend CSI and CIR smoke test on CPU
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'Studio Windows Test\app'
          $report = Join-Path $env:RUNNER_TEMP 'studio-acceptance'
          & .\desktop\windows\Test-Studio.ps1 -InstallDirectory $app -Headless -AllowCpu -ReportDirectory $report
      - name: Package and verify the portable Windows x64 build
        if: github.event_name != 'push'
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'Studio Windows Test\app'
          $staging = Join-Path $env:RUNNER_TEMP 'Studio Portable Staging'
          $artifacts = Join-Path $env:RUNNER_TEMP 'studio-candidate'
          $extracted = Join-Path $env:RUNNER_TEMP 'Studio Portable Review'
          New-Item -ItemType Directory -Path $staging, $artifacts, $extracted | Out-Null
          $installedPython = Join-Path $app 'runtime\.venv\Scripts\python.exe'
          & $installedPython -B -I .\desktop\windows\package_studio.py $app (Join-Path $staging 'SionnaRTStudio')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = Get-Content -Raw -LiteralPath (Join-Path $staging 'SionnaRTStudio\build-info.json') | ConvertFrom-Json
          if ($build.commit -ne $env:GITHUB_SHA -or $build.sourceDirty) { throw 'Candidate metadata does not match CI checkout' }
          $name = "SionnaRTStudio-$($build.appVersion)-windows-x64-$($build.commit.Substring(0, 12))-candidate.zip"
          $archive = Join-Path $artifacts $name
          tar.exe -a -cf $archive -C $staging SionnaRTStudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content -Encoding ASCII -LiteralPath (Join-Path $artifacts 'SHA256SUMS.txt')
          tar.exe -xf $archive -C $extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portable = Join-Path $extracted 'SionnaRTStudio'
          $python = Join-Path $portable 'runtime\python\python.exe'
          & $python -I -c 'from pathlib import Path; import sys; assert Path(sys.base_prefix) == Path(sys.executable).parent'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Join-Path $env:RUNNER_TEMP 'studio-acceptance\portable'
          New-Item -ItemType Directory -Path $report | Out-Null
          Copy-Item -LiteralPath (Join-Path $artifacts 'SHA256SUMS.txt') -Destination $report
          & .\desktop\windows\Test-Studio.ps1 -InstallDirectory $portable -Headless -AllowCpu -ReportDirectory $report
      - name: Save portable Windows x64 build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: SionnaRTStudio-windows-x64-candidate
          path: ${{ runner.temp }}/studio-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Show recent native Python crash events
        if: failure()
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'studio-acceptance'
          if (Test-Path -LiteralPath $report) {
            Get-ChildItem -LiteralPath $report -Filter 'studio.log' -Recurse | Get-Content -Tail 100
          }
          $since = (Get-Date).AddMinutes(-15)
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000; StartTime = $since } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match '(?i)python\.exe' } | Select-Object -First 3 -ExpandProperty Message
      - name: Save smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-acceptance
          path: ${{ runner.temp }}/studio-acceptance
          if-no-files-found: ignore
          retention-days: 7
