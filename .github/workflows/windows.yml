name: Windows desktop

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Locate LLVM for the CPU smoke test
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin\LLVM-C.dll'
          if (-not (Test-Path -LiteralPath $llvm -PathType Leaf)) { throw "Runner LLVM DLL missing at $llvm" }
          "DRJIT_LIBLLVM_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the Windows x64 build
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'Studio Windows Test\app'
          & .\desktop\windows\Install-Studio.ps1 -InstallDirectory $app -PythonPath (Get-Command python.exe).Source -NoShortcut -SkipWebView2Check
      - name: Check the frontend
        run: |
          npm.cmd run lint -- --noUnusedLocals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run check:osm-parser
          exit $LASTEXITCODE
      - name: Run installed backend CSI and CIR smoke test on CPU
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'Studio Windows Test\app'
          $report = Join-Path $env:RUNNER_TEMP 'studio-acceptance'
          & .\desktop\windows\Test-Studio.ps1 -InstallDirectory $app -Headless -AllowCpu -ReportDirectory $report
      - name: Package and verify the portable Windows x64 build
        if: github.event_name != 'push'
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'Studio Windows Test\app'
          $portable = Join-Path $env:RUNNER_TEMP 'Studio Portable Review\SionnaRTStudio'
          # Copy the base interpreter and installed wheels. A moved venv would
          # still look for the runner's Python installation in pyvenv.cfg.
          @'
          import os
          from pathlib import Path
          import shutil
          import sys

          installed, portable = map(Path, sys.argv[1:])
          home = Path(sys.base_prefix)
          shutil.copytree(installed, portable, ignore=shutil.ignore_patterns(".venv", "__pycache__"))
          python = portable / "runtime" / "python"
          python.mkdir()
          for name in ("python.exe", "python3.dll", "python312.dll", "LICENSE.txt"):
              shutil.copy2(home / name, python)
          for library in home.glob("vcruntime*.dll"):
              shutil.copy2(library, python)
          shutil.copytree(home / "DLLs", python / "DLLs")
          shutil.copytree(home / "Lib", python / "Lib",
                          ignore=shutil.ignore_patterns("site-packages", "__pycache__"))
          shutil.copytree(installed / "runtime" / ".venv" / "Lib" / "site-packages",
                          python / "Lib" / "site-packages",
                          ignore=shutil.ignore_patterns("__pycache__"))
          (portable / "README.txt").write_text(
              "Sionna RT Studio review build for Windows 11 x64.\n"
              "Extract the entire ZIP, then open SionnaRTStudio.exe.\n"
              "Requires Microsoft Edge WebView2 Runtime and either an NVIDIA driver "
              "with CUDA/OptiX support or an x64 LLVM runtime for CPU tracing.\n"
              f"Build commit: {os.environ['GITHUB_SHA']}\n",
              encoding="utf-8",
          )
          '@ | python.exe -I - $app $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $portable 'runtime\python\python.exe'
          & $python -I -c 'from pathlib import Path; import sys; assert Path(sys.base_prefix) == Path(sys.executable).parent'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Join-Path $env:RUNNER_TEMP 'studio-acceptance\portable'
          & .\desktop\windows\Test-Studio.ps1 -InstallDirectory $portable -Headless -AllowCpu -ReportDirectory $report
      - name: Save portable Windows x64 build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: SionnaRTStudio-windows-x64-review
          path: ${{ runner.temp }}/Studio Portable Review/SionnaRTStudio
          if-no-files-found: error
          retention-days: 14
      - name: Show recent native Python crash events
        if: failure()
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'studio-acceptance'
          if (Test-Path -LiteralPath $report) {
            Get-ChildItem -LiteralPath $report -Filter 'studio.log' -Recurse | Get-Content -Tail 100
          }
          $since = (Get-Date).AddMinutes(-15)
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000; StartTime = $since } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match '(?i)python\.exe' } | Select-Object -First 3 -ExpandProperty Message
      - name: Save smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-acceptance
          path: ${{ runner.temp }}/studio-acceptance
          if-no-files-found: ignore
          retention-days: 7
